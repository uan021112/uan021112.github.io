  <body>
    <div class="site">
      <main class="art-page">
        <header class="art-header">
          <a href="../">Back to home</a>
          <h1>Art &amp; Design</h1>
          <p>A few graphic design projects from my undergraduate years.</p>
        </header>

        <div class="artwork-grid">
          <figure class="artwork artwork--wide">
            <a class="artwork-image" href="../images/art-design/dormitory-bed-labels.jpg">
              <img src="../images/art-design/dormitory-bed-labels.jpg" alt="Dormitory bed labels with red borders, ink-wash mountains, swallows, and koi fish" width="1576" height="472" decoding="async">
            </a>
            <figcaption>
              <h2>Dormitory Bed Labels</h2>
              <p><a href="../images/art-design/dormitory-bed-labels.jpg">View full image</a></p>
            </figcaption>
          </figure>

          <figure class="artwork">
            <div class="artwork-scroll" tabindex="0" role="region" aria-labelledby="recruitment-title" aria-describedby="recruitment-hint">
              <img src="../images/art-design/youth-league-recruitment-preview.jpg" alt="Blue, space-themed Youth League recruitment graphic with team introductions, past projects, and QR codes" width="1000" height="14778" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <h2 id="recruitment-title">Youth League Recruitment</h2>
              <p id="recruitment-hint">Scroll to explore the design. <a href="../images/art-design/youth-league-recruitment.jpg">View full image (64 MB)</a></p>
            </figcaption>
          </figure>

          <figure class="artwork">
            <a class="artwork-image" href="../images/art-design/freshman-welcome-poster.jpg">
              <img src="../images/art-design/freshman-welcome-poster-preview.jpg" alt="Red freshman welcome poster for Beijing Jiaotong University with Chinese latticework, ink-wash mountains, and cranes" width="1200" height="1600" loading="lazy" decoding="async">

              <h2>Freshman Welcome Poster</h2>

            </figcaption>
          </figure>
        </div>

      <footer class="site-footer">
